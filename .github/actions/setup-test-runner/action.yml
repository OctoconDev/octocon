name: Setup .NET test runner
description: >
  Preamble for jobs that launch MTP test-host DLLs from the `build` job's
  artefact. Caller must run `actions/checkout@v4` first so this composite's
  own path resolves.

inputs:
  dotnet-version:
    description: '.NET SDK version, e.g. `10.0.x`.'
    required: true
  build-artifact-name:
    description: 'Name of the `build`-job artefact carrying the test-project bins, typically `dotnet-build-<sha>`.'
    required: true

runs:
  using: composite
  steps:
    # NuGet cache required for `test-int`: Aspire's `DcpHost` reads its native
    # orchestrator binary from an absolute path under
    # `~/.nuget/packages/aspire.hosting.orchestration.<rid>/<ver>/tools/dcp`,
    # bypassing every test host's copy-local `.deps.json`. Without the cache,
    # every `AspireFixture`-backed test fails at startup with FileNotFoundException.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        cache: true
        cache-dependency-path: |
          **/*.csproj
          global.json

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.build-artifact-name }}

    # The artefact is a tarball (see `Package build output` in ci-cd.yml) so
    # MTP test hosts keep their +x bit.
    - name: Extract build output
      shell: bash
      run: tar -xzf dotnet-build.tar.gz

    - name: Expose GitHub Actions Runtime
      uses: ./.github/actions/expose-actions-runtime
