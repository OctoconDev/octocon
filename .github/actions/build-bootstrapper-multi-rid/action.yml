name: Build multi-RID bootstrapper artefacts
description: >
  Multi-arch bootstrapper publish + tar.gz + per-RID upload. `platforms` and
  `rids` must be consistent (one `buildx_for` map entry per RID). Caller must
  run `actions/checkout@v4` and `docker/setup-buildx-action@v3` first. Adding
  a RID also needs updates in the `buildx_for` map below and in both
  Dockerfiles - see the `BUILD_PLATFORMS` env comment in `.github/workflows/ci-cd.yml`.

inputs:
  platforms:
    description: 'Buildx platform list. Must be consistent with `rids` via the `buildx_for` map.'
    required: true
  rids:
    description: 'Space-separated RID subset of `linux-x64 linux-arm linux-arm64` to package + upload. Must include `linux-x64` (guardrail-stage cp below is unconditional).'
    required: true
  dockerfile:
    description: 'Bootstrapper Dockerfile path, relative to repo root.'
    required: true
  artifact-suffix:
    description: 'Suffix on each artefact `name`, typically the commit SHA so runs don''t collide.'
    required: true

runs:
  using: composite
  steps:
    # Shares GHA cache scope `interfold-dotnet` with the API build in `publish`
    # so SDK base image, source-tree COPY layer, and the `id=nuget` cache mount
    # (exported by mode=max) dedup across both Dockerfiles.
    - name: Build bootstrapper binaries (multi-RID, parallel)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: out
        platforms: ${{ inputs.platforms }}
        outputs: type=local,dest=./bootstrap-out
        cache-from: type=gha,scope=interfold-dotnet
        cache-to: type=gha,mode=max,scope=interfold-dotnet

    # tar.gz preserves +x (upload-artifact's zip wrapper strips it) and only
    # packs RIDs the caller asked for. `buildx_for` is the sole RID <-> buildx
    # dir translation; the linux-x64 guardrail-stage cp is unconditional
    # because both PR and release paths always include linux-x64 in `rids`.
    - name: Tar.gz binaries + stage linux-x64 for binary-size guardrail
      shell: bash
      env:
        RIDS: ${{ inputs.rids }}
      run: |
        set -euo pipefail
        declare -A buildx_for=(
          [linux-x64]=linux_amd64
          [linux-arm64]=linux_arm64
          [linux-arm]=linux_arm_v7
        )
        for rid in $RIDS; do
          buildx_dir="${buildx_for[$rid]:-}"
          if [[ -z "$buildx_dir" ]]; then
            echo "Unknown RID '$rid' - update buildx_for in $GITHUB_ACTION_PATH/action.yml"
            exit 1
          fi
          chmod +x "bootstrap-out/$buildx_dir/interfold-bootstrap"
          tar -czf "interfold-bootstrap-$rid.tar.gz" \
            -C "bootstrap-out/$buildx_dir" interfold-bootstrap
        done
        dest=tools/Interfold.Bootstrapper/bin/Release/net10.0/linux-x64/publish
        mkdir -p "$dest"
        cp bootstrap-out/linux_amd64/interfold-bootstrap "$dest/interfold-bootstrap"
        chmod +x "$dest/interfold-bootstrap"

    # One artefact per RID so consumers download only the binary they need.
    # `if:` uses `format(' {0} ', ...)` word-boundaries so `linux-arm` doesn't
    # match a `linux-arm64`-only rids input as a substring.
    - name: Upload bootstrapper artifact (linux-x64)
      if: contains(format(' {0} ', inputs.rids), ' linux-x64 ')
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-x64-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-x64.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Upload bootstrapper artifact (linux-arm)
      if: contains(format(' {0} ', inputs.rids), ' linux-arm ')
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-arm-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-arm.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Upload bootstrapper artifact (linux-arm64)
      if: contains(format(' {0} ', inputs.rids), ' linux-arm64 ')
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-arm64-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-arm64.tar.gz
        retention-days: 7
        if-no-files-found: error
