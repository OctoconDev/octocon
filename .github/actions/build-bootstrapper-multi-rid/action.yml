name: Build multi-RID bootstrapper artefacts
description: >
  Multi-arch bootstrapper publish + tar.gz + per-RID upload. Caller must run
  `actions/checkout@v4` and `docker/setup-buildx-action@v3` first. Adding a
  RID also needs updates in `rid_for` below and in both Dockerfiles - see
  the `BUILD_PLATFORMS` env comment in `.github/workflows/ci-cd.yml`.

inputs:
  platforms:
    description: 'Buildx platform list; must match the `rid_for` map in the tar.gz step.'
    required: true
  dockerfile:
    description: 'Bootstrapper Dockerfile path, relative to repo root.'
    required: true
  artifact-suffix:
    description: 'Suffix on each artefact `name`, typically the commit SHA so runs don''t collide.'
    required: true

runs:
  using: composite
  steps:
    # Shares GHA cache scope `interfold-dotnet` with the API build in `publish`
    # so SDK base image, source-tree COPY layer, and the `id=nuget` cache mount
    # (exported by mode=max) dedup across both Dockerfiles.
    - name: Build bootstrapper binaries (multi-RID, parallel)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: out
        platforms: ${{ inputs.platforms }}
        outputs: type=local,dest=./bootstrap-out
        cache-from: type=gha,scope=interfold-dotnet
        cache-to: type=gha,mode=max,scope=interfold-dotnet

    # tar.gz preserves +x (upload-artifact's zip wrapper would strip it). Also
    # stage linux-x64 at the path BinarySizeGuardrailTests walks up to. The
    # rid_for map is the only place buildx dir names <-> RIDs are translated.
    - name: Tar.gz binaries + stage linux-x64 for binary-size guardrail
      shell: bash
      run: |
        set -euo pipefail
        declare -A rid_for=(
          [linux_amd64]=linux-x64
          [linux_arm64]=linux-arm64
          [linux_arm_v7]=linux-arm
        )
        for buildx_dir in "${!rid_for[@]}"; do
          rid="${rid_for[$buildx_dir]}"
          chmod +x "bootstrap-out/$buildx_dir/interfold-bootstrap"
          tar -czf "interfold-bootstrap-$rid.tar.gz" \
            -C "bootstrap-out/$buildx_dir" interfold-bootstrap
        done
        dest=tools/Interfold.Bootstrapper/bin/Release/net10.0/linux-x64/publish
        mkdir -p "$dest"
        cp bootstrap-out/linux_amd64/interfold-bootstrap "$dest/interfold-bootstrap"
        chmod +x "$dest/interfold-bootstrap"

    # One artefact per RID so consumers download only the binary they need.
    - name: Upload bootstrapper artifact (linux-x64)
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-x64-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-x64.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Upload bootstrapper artifact (linux-arm)
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-arm-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-arm.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Upload bootstrapper artifact (linux-arm64)
      uses: actions/upload-artifact@v4
      with:
        name: interfold-bootstrap-linux-arm64-${{ inputs.artifact-suffix }}
        path: interfold-bootstrap-linux-arm64.tar.gz
        retention-days: 7
        if-no-files-found: error
